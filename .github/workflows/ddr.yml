name: Rebuild DDR references
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ddr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: npm ci --force
      - run: npm run build:ddr
      - run: npm run assemble-site -- --from-public
      - run: npm test
      - run: npm run typecheck
